{"id":426764572,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORsnMJ84Zb-kc","tag_name":"v2.13.2","target_commitish":"main","name":"SkillSpector v2.13.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-28T14:18:59Z","updated_at":"2026-10-28T14:21:06Z","published_at":"2026-10-28T14:19:21Z","assets":[{"id":685229072,"node_id":"RA_kwDORsnMJ84o18QQ","name":"skillspector-2.13.2-py3-none-any.whl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":841741,"digest":"sha256:82bd8e468229c949cd178edce058fceb95c415fd845ba924f56e7160c8b4b7ea","download_count":221,"created_at":"2026-10-28T14:19:20Z","updated_at":"2026-10-28T14:19:21Z"},{"id":685229076,"node_id":"RA_kwDORsnMJ84o18QU","name":"skillspector-2.13.2.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1958151,"digest":"sha256:a08ffad0998e6e94578a7dc747be30a80f7db251e833c5900af585dbc7ef400e","download_count":73,"created_at":"2026-10-28T14:19:20Z","updated_at":"2026-10-28T14:19:21Z"}],"body":"# SkillSpector 2.13.2\n\nThis patch release builds on the published v2.13.1 maintenance release and\nbackports three fixes for false incomplete-analysis reports. It preserves the\nexisting maintenance fixes, third-party dependency lock, and provider defaults.\n\n## Fixes\n\n- [#779](https://github.com/NVIDIA/SkillSpector/pull/779): Recognize command wrappers\n  with no wrapped command at a proven clause boundary. Markdown table cells and\n  ordinary source references to `timeout`, `sudo`, `nice`, and `xargs` no longer\n  cause false parser-limit reports. Redirections, unfinished fragments, and\n  commands in subsequent clauses retain their existing checks.\n- [#917](https://github.com/NVIDIA/SkillSpector/pull/917): Treat `sudo -n` as a flag\n  and parse descriptor redirections such as `2>&1` as complete operators. Align\n  the MCP TP4 batch limit with its existing 128-file limit so supported inputs\n  are not prematurely truncated after 64 batches. Byte, token, declaration,\n  file, runtime, and provider-error limits remain enforced.\n- [#921](https://github.com/NVIDIA/SkillSpector/pull/921): Recognize direct template\n  messages on verified built-in Node assertion imports, avoiding false shell\n  substitution limits in JavaScript helpers. Classify `.mjs` and `.cjs` files\n  consistently, including archive members. Raw security findings and their\n  source locations are preserved. Ambiguous syntax, assertion aliases or\n  mutations, effectful interpolation, and exceeded bounds remain conservative;\n  TypeScript retains its existing parser path.\n\n## Scope and upgrading\n\nThe JavaScript correction is a bounded assertion-message proof, not a general\nJavaScript parser or dataflow analysis. It assumes ordinary built-in assertion\nsemantics and does not prove the absence of arbitrary runtime mutation or\nobject getters. Existing findings and independent inspection limitations remain\nvisible; these fixes do not suppress malformed provider responses.\n\nRegenerate and review exact version-bound finding baselines for 2.13.2 rather\nthan relabeling baselines from another scanner version. The GitHub release\nprovides a wheel and source distribution; the publication workflow does not\npublish to PyPI.\n\n## Validation and known limitations\n\nThis release preserves every v2.13.1 commit and includes #779, #917 and #921. All six [candidate CI jobs](https://github.com/NVIDIA/SkillSpector/actions/runs/40539160128) passed, including 12,395 unit tests. Fresh local packaging checks, 72 offline acceptance scans and 22 additional boundary checks also passed.\n\nLive acceptance completed all 28 planned cases: 26 passed and two large-skill TP4 cases failed under the unchanged 600-second workflow budget. The candidate planned 118 batches, but completed 65 from source and 66 from the installed wheel; all remaining ranges were explicitly reported as runtime-limited. The old 64-batch planning cap is removed, but complete live inspection of this large input is not established. Live LLM coverage used one configured model through the NVIDIA gateway; other provider routes were not qualified. The CAD checks exercised preparation plus TP4, not the entire CLI analysis workflow.\n\nThe batch cap is now 128, so a reported 145-batch workload still exceeds it. Large-skill runtime completion, remaining obfuscated-instruction limitations, evaluator binary-scope admission policy and deduplication limits, and general malformed-provider-response failures remain unresolved follow-up work. Independent content findings and missing-reference limitations remain visible; upgrading does not guarantee that a downstream admission gate passes.\n\nSee [release PR #922](https://github.com/NVIDIA/SkillSpector/pull/922) for validation details.\n"}
